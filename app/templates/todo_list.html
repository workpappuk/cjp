<ul class="space-y-2">

{% for todo in todos %}

<li class="flex items-center justify-between border p-3 rounded">

  <div class="flex items-center gap-3">

    <button
      hx-post="/todos/{{ todo.id }}/toggle"
      hx-target="#todo-list"
      hx-swap="innerHTML"
      class="text-xl"
    >
      {% if todo.completed %}
        ✅
      {% else %}
        ⬜
      {% endif %}
    </button>

    <span
      class="{% if todo.completed %}line-through text-gray-400{% endif %}"
    >
      {{ todo.title }}
    </span>

  </div>

  <button
    hx-post="/todos/{{ todo.id }}/delete"
    hx-target="#todo-list"
    hx-swap="innerHTML"
    class="text-red-500"
  >
    Delete
  </button>

</li>

{% endfor %}

</ul>
