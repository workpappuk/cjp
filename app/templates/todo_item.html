<li id="todo-{{ todo.id }}" class="grid gap-4 rounded-[1.75rem] border border-slate-700/80 bg-white/5 p-5 shadow-lg shadow-slate-950/10 transition duration-300 hover:-translate-y-0.5 hover:bg-white/10 sm:grid-cols-[auto_1fr_auto] sm:items-center">
  <button
    hx-post="/todos/{{ todo.id }}/toggle?q={{ q | urlencode }}&page={{ current_page }}"
    hx-target="#todo-list"
    hx-swap="innerHTML"
    class="flex h-12 w-12 items-center justify-center rounded-3xl border border-slate-600/80 bg-slate-950/90 text-xl transition hover:border-sky-400 hover:text-sky-300"
    aria-label="Toggle todo status"
  >
    {% if todo.completed %}
      ✅
    {% else %}
      ⬜
    {% endif %}
  </button>

  <div class="space-y-3">
    {% if edit %}
      <form
        hx-post="/todos/{{ todo.id }}/edit?q={{ q | urlencode }}&page={{ current_page }}"
        hx-target="#todo-list"
        hx-swap="innerHTML"
        class="grid gap-3 sm:grid-cols-[1fr_auto] sm:items-center"
      >
        <input
          type="text"
          name="title"
          value="{{ todo.title }}"
          class="w-full rounded-3xl border border-slate-700/80 bg-slate-950/90 px-4 py-3 text-slate-100 focus:border-sky-400 focus:outline-none focus:ring-2 focus:ring-sky-400/20"
        />
        <input type="hidden" name="q" value="{{ q | default('') }}" />
        <input type="hidden" name="page" value="{{ current_page }}" />
        <div class="flex flex-wrap gap-2">
          <button class="rounded-3xl bg-emerald-500 px-5 py-3 text-sm font-semibold text-white transition hover:bg-emerald-400">Save</button>
          <button
            type="button"
            hx-get="/todos/{{ todo.id }}?q={{ q | urlencode }}&page={{ current_page }}"
            hx-target="#todo-{{ todo.id }}"
            hx-swap="outerHTML"
            class="rounded-3xl border border-slate-700/80 bg-slate-950/90 px-5 py-3 text-sm text-slate-200 transition hover:border-slate-500 hover:bg-slate-900"
          >
            Cancel
          </button>
        </div>
      </form>
    {% else %}
      <div class="flex items-center gap-3">
        <span class="text-base font-semibold text-slate-100 {% if todo.completed %}line-through text-slate-400{% endif %}">{{ todo.title }}</span>
      </div>
      <div class="text-sm text-slate-400">ID #{{ todo.id }}</div>
    {% endif %}
  </div>

  {% if not edit %}
    <div class="flex flex-wrap items-center justify-end gap-3">
      <button
        hx-get="/todos/{{ todo.id }}/edit?q={{ q | urlencode }}&page={{ current_page }}"
        hx-target="#todo-{{ todo.id }}"
        hx-swap="outerHTML"
        class="rounded-full border border-slate-700/80 bg-slate-950/90 px-4 py-2 text-sm font-semibold text-slate-100 transition hover:border-sky-400 hover:bg-slate-900"
      >
        Edit
      </button>
      <button
        hx-post="/todos/{{ todo.id }}/delete?q={{ q | urlencode }}&page={{ current_page }}"
        hx-target="#todo-list"
        hx-swap="innerHTML"
        class="rounded-full border border-rose-500/40 bg-rose-500/10 px-4 py-2 text-sm font-semibold text-rose-200 transition hover:bg-rose-500/20"
      >
        Delete
      </button>
    </div>
  {% endif %}
</li>
